name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore PersonalLogManagerClient.slnx
    - name: Build
      run: dotnet build PersonalLogManagerClient.slnx --no-restore
    - name: Test
      run: dotnet test PersonalLogManagerClient.slnx --no-build --verbosity normal
